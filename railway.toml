[build]
builder = "nixpacks"

[deploy]
# Runs before the new instance goes live — migrations + seed are safe to re-run (idempotent)
releaseCommand = "python manage.py migrate --run-syncdb && python manage.py seed_data && python manage.py collectstatic --noinput"
startCommand = "gunicorn election.wsgi:application --workers 4 --threads 2 --bind 0.0.0.0:$PORT --timeout 30 --log-level info"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "always"